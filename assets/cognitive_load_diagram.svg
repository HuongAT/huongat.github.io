<svg width="900" viewBox="0 0 900 720" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Cognitive Load Theory Diagram</title>
  <desc>Flow diagram showing how sensory input flows through working memory to long-term memory, with intrinsic, extraneous, and germane loads, plus a three-perspectives summary panel.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#8A84B8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="720" fill="#FAFAF8"/>

  <!-- ── SENSORY INPUT (top center) ── -->
  <rect x="320" y="30" width="260" height="62" rx="10" fill="#E8E6E0" stroke="#B4B2A9" stroke-width="1.2"/>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="600" fill="#2C2C2A" text-anchor="middle" x="450" y="57">Sensory input</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#5F5E5A" text-anchor="middle" x="450" y="77">Instruction, environment</text>

  <!-- Arrow: Sensory → Working memory -->
  <line x1="450" y1="92" x2="450" y2="152" stroke="#888780" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── WORKING MEMORY (center) ── -->
  <rect x="268" y="153" width="364" height="110" rx="12" fill="#DDEAF8" stroke="#378ADD" stroke-width="1.5"/>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#185FA5" text-anchor="middle" x="450" y="185">Working memory</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#185FA5" text-anchor="middle" x="450" y="204">Limited capacity bottleneck</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#185FA5" text-anchor="middle" x="450" y="220">~4 items, ~20 seconds</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-style="italic" fill="#378ADD" text-anchor="middle" x="450" y="238">where conscious thinking happens</text>

  <!-- ── INTRINSIC LOAD (left) ── -->
  <rect x="60" y="163" width="175" height="62" rx="10" fill="#F5EDCE" stroke="#BA7517" stroke-width="1.2"/>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#633806" text-anchor="middle" x="148" y="189">Intrinsic load</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#854F0B" text-anchor="middle" x="148" y="208">Inherent complexity</text>

  <!-- Arrow: Intrinsic → Working memory -->
  <line x1="235" y1="194" x2="266" y2="207" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── EXTRANEOUS LOAD (right top) ── -->
  <rect x="668" y="153" width="182" height="62" rx="10" fill="#FCDDD8" stroke="#993C1D" stroke-width="1.2"/>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#4A1B0C" text-anchor="middle" x="759" y="179">Extraneous load</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#993C1D" text-anchor="middle" x="759" y="198">Wasted effort</text>

  <!-- Arrow: Extraneous → Working memory -->
  <line x1="668" y1="190" x2="634" y2="200" stroke="#993C1D" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── GERMANE LOAD (right bottom) ── -->
  <rect x="668" y="235" width="182" height="62" rx="10" fill="#D2EDE0" stroke="#0F6E56" stroke-width="1.2"/>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#04342C" text-anchor="middle" x="759" y="261">Germane load</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" x="759" y="280">Productive chunking work</text>

  <!-- Arrow: Germane → Working memory -->
  <line x1="668" y1="258" x2="634" y2="240" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ── CHUNKING (center right, between WM and LTM) ── -->
  <rect x="497" y="288" width="182" height="52" rx="10" fill="#FFF0C0" stroke="#BA7517" stroke-width="1.2"/>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#633806" text-anchor="middle" x="588" y="311">Chunking</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-style="italic" fill="#854F0B" text-anchor="middle" x="588" y="329">formation: build the schema</text>

  <!-- Arrow: Working memory → LTM (main vertical) -->
  <line x1="450" y1="264" x2="450" y2="354" stroke="#888780" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ── CATALYTIC LOOP (left center) ── -->
  <rect x="60" y="288" width="188" height="70" rx="10" fill="none" stroke="#8A84B8" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#534AB7" text-anchor="middle" x="154" y="313">Catalytic loop</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#534AB7" text-anchor="middle" x="154" y="331">retrieved schemas enter</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-style="italic" fill="#534AB7" text-anchor="middle" x="154" y="348">working memory as chunks</text>

  <!-- Dashed arrow: Catalytic loop ↗ Working memory -->
  <path d="M154 288 Q164 238 268 220" fill="none" stroke="#8A84B8" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>

  <!-- Dashed arrow: LTM → Catalytic loop -->
  <path d="M268 412 Q180 420 154 360" fill="none" stroke="#8A84B8" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arrow-dashed)"/>

  <!-- ── LONG-TERM MEMORY (bottom center) ── -->
  <rect x="240" y="354" width="420" height="100" rx="12" fill="#EDE6FA" stroke="#7F77DD" stroke-width="1.5"/>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#3C3489" text-anchor="middle" x="450" y="390">Long-term memory</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#534AB7" text-anchor="middle" x="450" y="412">Schemas — organized knowledge</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#534AB7" text-anchor="middle" x="450" y="430">Effectively unlimited capacity</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-style="italic" fill="#7F77DD" text-anchor="middle" x="450" y="448">storage: where built schemas live</text>

  <!-- ── BOTTOM PANEL: Three perspectives ── -->
  <rect x="60" y="492" width="780" height="200" rx="14" fill="#F7F5EE" stroke="#D3D1C7" stroke-width="1.2"/>

  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#2C2C2A" text-anchor="middle" x="450" y="520">The three perspectives on one phenomenon</text>

  <!-- Dividers -->
  <line x1="340" y1="536" x2="340" y2="672" stroke="#D3D1C7" stroke-width="1"/>
  <line x1="560" y1="536" x2="560" y2="672" stroke="#D3D1C7" stroke-width="1"/>

  <!-- Column: Chunking -->
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#BA7517" text-anchor="middle" x="200" y="558">Chunking</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" x="200" y="578">formation</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" x="200" y="610">build it through</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" x="200" y="628">repeated exposure</text>

  <!-- Column: Schema -->
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#2C2C2A" text-anchor="middle" x="450" y="558">Schema</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" x="450" y="578">storage</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" x="450" y="610">organized knowledge</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" x="450" y="628">in long-term memory</text>

  <!-- Column: Chunk -->
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#185FA5" text-anchor="middle" x="700" y="558">Chunk</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" x="700" y="578">use</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" x="700" y="610">a schema retrieved</text>
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" x="700" y="628">into working memory</text>

  <!-- Bottom tagline -->
  <text font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-style="italic" fill="#888780" text-anchor="middle" x="450" y="668">Build it through chunking. Store it as a schema. Use it as a chunk.</text>

</svg>
